version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "schema"
    gen:
      go:
        package: "db"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        overrides:
          # TIMESTAMPTZ 默认生成 pgtype.Timestamptz；映射成标准库 time.Time
          # 让生成码与手写版的接口（返回 time.Time）对齐
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
