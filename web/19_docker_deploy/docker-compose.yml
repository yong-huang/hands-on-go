# 三服务全家桶：app + postgres + redis。
# depends_on 的 condition: service_healthy 是"等真就绪"——
# PostgreSQL 容器起来 ≠ PostgreSQL 接受查询。
services:
  app:
    build:
      context: ..                       # 上下文 = web/（go.mod 所在处）
      dockerfile: 19_docker_deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MARKLET_ADDR: "0.0.0.0:8080"
      MARKLET_PG_DSN: "postgres://marklet:marklet@postgres:5432/marklet?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s   # 与实验 18 的编排预算对齐

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: marklet
      POSTGRES_USER: marklet
      POSTGRES_DB: marklet
    volumes:
      - pgdata:/var/lib/postgresql/data   # 数据卷：down 不丢数据
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marklet"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
